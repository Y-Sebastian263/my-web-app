<!DOCTYPE html>
  <html lang="ja">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOリスト</title>
  <style>
    :root {
      --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
          --muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --done: #64748b;
    --danger: #ef4444;
      }
  * { box-sizing: border-box; }
  body {
        margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
}
  .app {
        width: 100%;
    max-width: 480px;
}
  h1 {
        font-size: 1.5rem;
    margin-bottom: 4px;
}
  .subtitle {
        color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .input-row {
        display: flex;
    gap: 8px;
    margin-bottom: 20px;
}
  #todo-input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
}
  #todo-input:focus {
    border-color: var(--accent);
}
  #add-btn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
}
  #add-btn:hover { background: var(--accent-hover); }

  .filters {
        display: flex;
    gap: 8px;
    margin-bottom: 16px;
}
  .filter-btn {
        padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
}
  .filter-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  ul#todo-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
  li.todo-item {
        display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
}
  li.todo-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
}
  li.todo-item .text {
    flex: 1;
    word-break: break-word;
  }
  li.todo-item.done .text {
    text-decoration: line-through;
    color: var(--done);
  }
  li.todo-item .delete-btn {
        border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px 8px;
    border-radius: 6px;
}
  li.todo-item .delete-btn:hover {
        color: var(--danger);
    background: rgba(239, 68, 68, 0.1);
}

  .empty-state {
        text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 0.9rem;
}

  .footer {
        margin-top: 20px;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.85rem;
}
  #clear-completed {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    font-size: 0.85rem;
}
  #clear-completed:hover { color: var(--text); }
</style>
  </head>
  <body>
    <div class="app">
      <h1>TODOリスト</h1>
      <p class="subtitle">タスクを追加して管理しましょう（ブラウザに自動保存されます）</p>

      <div class="input-row">
        <input type="text" id="todo-input" placeholder="新しいタスクを入力..." autocomplete="off" />
        <button id="add-btn">追加</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">未完了</button>
        <button class="filter-btn" data-filter="done">完了</button>
      </div>

      <ul id="todo-list"></ul>
      <div class="empty-state" id="empty-state" style="display:none;">タスクはまだありません</div>

      <div class="footer">
        <span id="count-label">0 件のタスク</span>
        <button id="clear-completed">完了済みを削除</button>
      </div>
    </div>

  <script>
    const STORAGE_KEY = "todo-list-items";
  let todos = [];
  let currentFilter = "all";

  const listEl = document.getElementById("todo-list");
  const inputEl = document.getElementById("todo-input");
  const addBtn = document.getElementById("add-btn");
  const emptyState = document.getElementById("empty-state");
  const countLabel = document.getElementById("count-label");
  const clearCompletedBtn = document.getElementById("clear-completed");
  const filterBtns = document.querySelectorAll(".filter-btn");

  function loadTodos() {
        try {
      const raw = localStorage.getItem(STORAGE_KEY);
      todos = raw ? JSON.parse(raw) : [];
        } catch (e) {
      todos = [];
        }
  }

  function saveTodos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
        listEl.innerHTML = "";
    const filtered = todos.filter(t => {
      if (currentFilter === "active") return !t.done;
      if (currentFilter === "done") return t.done;
      return true;
  });

    emptyState.style.display = filtered.length === 0 ? "block" : "none";

    filtered.forEach(todo => {
            const li = document.createElement("li");
      li.className = "todo-item" + (todo.done ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.addEventListener("change", () => toggleTodo(todo.id));

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = todo.text;

      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
});

    const activeCount = todos.filter(t => !t.done).length;
    countLabel.textContent = `${activeCount} 件の未完了タスク（全 ${todos.length} 件）`;
}

  function addTodo() {
        const text = inputEl.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now(), text, done: false });
    inputEl.value = "";
    saveTodos();
    render();
  }

  function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos();
    render();
  }

  function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
    saveTodos();
    render();
  }

  function clearCompleted() {
        todos = todos.filter(t => !t.done);
    saveTodos();
    render();
  }

  addBtn.addEventListener("click", addTodo);
  inputEl.addEventListener("keydown", e => {
        if (e.key === "Enter") addTodo();
});
  clearCompletedBtn.addEventListener("click", clearCompleted);

  filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          filterBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
});
});

  loadTodos();
  render();
</script>
  </body>
  </html>
